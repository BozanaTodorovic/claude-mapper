# Fails the PR if any MAP.md is older than the latest commit that touched
# its repo — i.e. someone changed the folder structure and forgot to
# regenerate the map. Copy this file to .github/workflows/check-maps.yml.
#
# Single-repo setup: remove --all and --match, `claude-mapper check` alone
# checks the repo the workflow runs in.

name: Check navigation maps

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-maps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history for `git log -1` per repo

      - name: Check MAP.md staleness
        run: npx claude-mapper check --all
        # For a multi-repo workspace where sub-repos are checked out as
        # sibling folders, add: --match "^my-org-"
